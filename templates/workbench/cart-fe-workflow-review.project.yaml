version: 1
project:
  id: cart-fe-workflow-review
  name: Cart FE Workflow Review
  description: 购物车前端评审工作台项目，以项目策略引用连接三类独立验收员工。
  scope: repository
connector:
  kind: worktree-review
  config:
    roleSource: src/core/reviewRoleAgents.ts
roles:
  requirement-steward:
    displayName: 需求管家
    description: 通过对话澄清目标项目的需求并生成待人工确认的结构化草稿，不直接创建或推进需求。
    requiredSkills: [humanizer-zh]
    knowledgeProfiles: [workbench-product-knowledge]
    policyRef: docs/project-roles/requirement-steward.md
    outputSchema:
      type: object
      additionalProperties: false
      required: [message, nextAction, draft]
      properties:
        message:
          type: string
          minLength: 1
        nextAction:
          enum: [clarify, draft]
        draft:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [title, summary, priority, rawRequirement, acceptanceCriteria]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                summary: { type: string, maxLength: 160 }
                priority: { enum: [low, medium, high] }
                rawRequirement: { type: string, minLength: 1 }
                acceptanceCriteria:
                  type: array
                  items: { type: string, minLength: 1 }
    permissions:
      write: none
      tools: [Read, Glob, Grep]
  product-manager:
    displayName: 产品验收
    description: 还原需求、评估产品合理性并定义可追溯的验收标准。
    requiredSkills: [humanizer-zh]
    knowledgeProfiles: [workbench-product-knowledge]
    policyRef: docs/review-role-agents/product-manager/base.md
    permissions:
      write: none
  designer:
    displayName: 设计验收
    description: 对真实运行页面完成桌面端视觉与交互验收。
    requiredSkills: [hallmark, interaction-state-completeness]
    knowledgeProfiles: [workbench-design-knowledge]
    policyRef: docs/review-role-agents/xiaohu-designer/base.md
    permissions:
      write: none
  tester:
    displayName: 测试验收
    description: 通过真实浏览器行为与 E2E 覆盖确认交付质量。
    requiredSkills: [browser-e2e-validation]
    knowledgeProfiles: [workbench-quality-knowledge]
    policyRef: docs/review-role-agents/xiaomixiang-tester/base.md
    outputSchema:
      type: object
      additionalProperties: false
      required: [verdict, summary, e2eEvidence]
      properties:
        verdict:
          enum: [pass, block]
        summary:
          type: string
          minLength: 1
        e2eEvidence:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [method, steps, observed]
            properties:
              method:
                enum: [browser, http-behavior, automation-run]
              steps:
                type: string
                minLength: 1
              observed:
                type: string
                minLength: 1
        risks:
          type: array
          items:
            type: string
    permissions:
      write: none
