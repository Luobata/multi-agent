<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="蜡笔双叶幼苗图标">
  <!-- Original 16x16 crayon twin-leaf sprout for the Futaba Kindergarten workbench.
       Palette from tokens.css crayon skin: sky #f6d97a, cloud #fffaf0, ink #4a3320,
       season-spring #7fc06a, seal-green #4f8f3a, sky-deep #e7b84e. -->
  <rect width="16" height="16" rx="2" fill="#f6d97a"/>
  <!-- warm sun-yellow highlight corners -->
  <g fill="#fffaf0">
    <rect x="1" y="1" width="2" height="1"/><rect x="1" y="2" width="1" height="1"/>
    <rect x="13" y="1" width="2" height="1"/><rect x="14" y="2" width="1" height="1"/>
  </g>
  <!-- soil ground -->
  <rect x="0" y="14" width="16" height="2" fill="#e7b84e"/>
  <!-- centered crayon stem in warm brown ink -->
  <rect x="7" y="7" width="2" height="7" fill="#4a3320"/>
  <!-- left leaf: ink outline -->
  <g fill="#4a3320">
    <rect x="3" y="4" width="1" height="1"/>
    <rect x="2" y="5" width="1" height="3"/>
    <rect x="3" y="8" width="4" height="1"/>
  </g>
  <!-- left leaf: spring green body, tucks into stem at x=7 -->
  <g fill="#7fc06a">
    <rect x="3" y="5" width="4" height="1"/>
    <rect x="3" y="6" width="4" height="1"/>
    <rect x="4" y="7" width="3" height="1"/>
  </g>
  <!-- right leaf: ink outline (mirror of left) -->
  <g fill="#4a3320">
    <rect x="12" y="4" width="1" height="1"/>
    <rect x="13" y="5" width="1" height="3"/>
    <rect x="9" y="8" width="4" height="1"/>
  </g>
  <!-- right leaf: deeper seal green body, tucks into stem at x=9 -->
  <g fill="#4f8f3a">
    <rect x="9" y="5" width="4" height="1"/>
    <rect x="9" y="6" width="4" height="1"/>
    <rect x="9" y="7" width="3" height="1"/>
  </g>
  <!-- leaf shine specks -->
  <rect x="4" y="5" width="1" height="1" fill="#fffaf0"/>
  <rect x="11" y="5" width="1" height="1" fill="#fffaf0"/>
</svg>
