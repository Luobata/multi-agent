version: 1
project:
  id: local-agent-workbench
  name: Local Agent Workbench
  description: 当前仓库的全员协作接入；项目只声明角色契约，员工身份与 Provider 继续由 Workbench 管理。
  scope: repository
connector:
  kind: repository-development
  config:
    sourceRoots: [src, client]
    requirementAdvancement:
      entrancePolicyId: default-task-entrance-policy
      # 领队只接受以下显式交付口令；普通需求描述和“开始推进”不会触发。
      triggerMode: explicit-delivery
      deliveryTargets: [小米汪, 小米汪领队]
      candidateUrl: http://127.0.0.1:4319
      polling:
        # 人工按钮与未来轮询器复用同一幂等推进协议；首期只开放人工启动。
        enabled: false
        intervalMs: 15000
roles:
  product-manager:
    displayName: 产品经理
    description: 负责需求澄清、范围取舍、关键状态与可观察验收标准。
    requiredSkills: [humanizer-zh]
    knowledgeProfiles: [workbench-product-knowledge]
    policyRef: docs/project-roles/product-manager.md
    permissions:
      write: none
      tools: [Read, Glob, Grep]
  requirement-steward:
    displayName: 需求管家
    description: 通过对话澄清需求并生成待人工确认的结构化需求草稿，不直接创建或推进需求。
    requiredSkills: [humanizer-zh]
    knowledgeProfiles: [workbench-product-knowledge]
    policyRef: docs/project-roles/requirement-steward.md
    outputSchema:
      type: object
      additionalProperties: false
      required: [message, nextAction, draft]
      properties:
        message:
          type: string
          minLength: 1
        nextAction:
          enum: [clarify, draft]
        draft:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [title, summary, priority, rawRequirement, acceptanceCriteria]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                summary: { type: string, maxLength: 160 }
                priority: { enum: [low, medium, high] }
                rawRequirement: { type: string, minLength: 1 }
                acceptanceCriteria:
                  type: array
                  items: { type: string, minLength: 1 }
    permissions:
      write: none
      tools: [Read, Glob, Grep]
  product-designer:
    displayName: 产品设计师
    description: 负责信息架构、交互状态、视觉一致性与可访问性设计验收。
    requiredSkills: [hallmark, interaction-state-completeness]
    optionalSkills: [healing-pixel-dossier]
    knowledgeProfiles: [workbench-design-knowledge]
    policyRef: docs/project-roles/product-designer.md
    permissions:
      write: none
      tools: [Read, Glob, Grep]
  frontend-developer:
    displayName: 前端开发工程师
    description: 负责 client 下的 React、TypeScript、CSS、交互状态、数据接入和前端自动化测试。
    knowledgeProfiles: [workbench-engineering-knowledge, workbench-design-knowledge]
    policyRef: docs/project-roles/frontend-developer.md
    permissions:
      write: project
      tools: [Read, Glob, Grep, Edit, Write, Bash]
    outputSchema:
      type: object
      additionalProperties: false
      required: [message, changedFiles, validation, risks]
      properties:
        message: { type: string, minLength: 1, description: "交付摘要与关键取舍" }
        changedFiles:
          type: array
          description: "实际修改的仓库相对路径"
          items: { type: string, minLength: 1 }
        validation:
          type: array
          description: "实际执行且有结果的验证命令或行为检查"
          items: { type: string, minLength: 1 }
        risks:
          type: array
          description: "仍未消除的风险；没有风险时返回空数组"
          items: { type: string, minLength: 1 }
  backend-developer:
    displayName: 服务端开发工程师
    description: 负责 TypeScript 服务端、API、Provider、运行时、持久化与服务端测试。
    knowledgeProfiles: [workbench-engineering-knowledge]
    policyRef: docs/project-roles/backend-developer.md
    permissions:
      write: project
      tools: [Read, Edit, Shell, Test]
    outputSchema:
      type: object
      additionalProperties: false
      required: [message, changedFiles, validation, risks]
      properties:
        message: { type: string, minLength: 1, description: "交付摘要与关键取舍" }
        changedFiles:
          type: array
          description: "实际修改的仓库相对路径"
          items: { type: string, minLength: 1 }
        validation:
          type: array
          description: "实际执行且有结果的验证命令或行为检查"
          items: { type: string, minLength: 1 }
        risks:
          type: array
          description: "仍未消除的风险；没有风险时返回空数组"
          items: { type: string, minLength: 1 }
  fullstack-developer:
    displayName: 全栈开发工程师
    description: 负责明确分派的跨前后端实现、契约联调、迁移与集成验证。
    knowledgeProfiles: [workbench-engineering-knowledge]
    policyRef: docs/project-roles/fullstack-developer.md
    permissions:
      write: project
      tools: [Read, Edit, Shell, Test]
    outputSchema:
      type: object
      additionalProperties: false
      required: [message, changedFiles, validation, risks]
      properties:
        message: { type: string, minLength: 1, description: "交付摘要与关键取舍" }
        changedFiles:
          type: array
          description: "实际修改的仓库相对路径"
          items: { type: string, minLength: 1 }
        validation:
          type: array
          description: "实际执行且有结果的验证命令或行为检查"
          items: { type: string, minLength: 1 }
        risks:
          type: array
          description: "仍未消除的风险；没有风险时返回空数组"
          items: { type: string, minLength: 1 }
  test-engineer:
    displayName: 测试工程师
    description: 负责真实行为、服务响应、持久化结果与自动化覆盖的独立验收。
    requiredSkills: [browser-e2e-validation]
    knowledgeProfiles: [workbench-quality-knowledge]
    policyRef: docs/project-roles/test-engineer.md
    outputSchema:
      type: object
      additionalProperties: false
      required: [verdict, summary, e2eEvidence, risks]
      properties:
        verdict:
          enum: [pass, block]
        summary:
          type: string
          minLength: 1
        e2eEvidence:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [method, steps, observed]
            properties:
              method:
                enum: [browser, http-behavior, automation-run]
              steps:
                type: string
                minLength: 1
              observed:
                type: string
                minLength: 1
        risks:
          type: array
          items:
            type: string
    permissions:
      write: none
      # Employee 与项目角色取权限交集；Bash 必须在两侧都声明，独立测试才能真实执行 npm/vitest。
      tools: [Read, Glob, Grep, WebFetch, Bash, browser]
  knowledge-steward:
    displayName: 项目知识管理员
    description: 通过受限 Knowledge Control MCP 查询知识状态、生成变更提案，并把最终审批留给人。
    requiredSkills: [knowledge-control-conversation]
    requiredProviderProfiles: [knowledge-proposal-only]
    knowledgeProfiles: []
    policyRef: docs/project-roles/knowledge-steward.md
    permissions:
      write: none
      tools:
        - knowledge_control_snapshot
        - knowledge_base_get
        - knowledge_revision_assess
        - knowledge_revision_preview
        - knowledge_url_preview
        - knowledge_url_propose
        - knowledge_wiki_get
        - employee_knowledge_perspective
        - knowledge_review_list
        - knowledge_impact_get
        - knowledge_change_list
        - knowledge_change_get
        - knowledge_change_propose
  configuration-steward:
    displayName: 员工配置管家
    description: 通过受限 Configuration Control MCP 读取单个 Employee 并生成待人工逐项审阅的严格配置 Proposal。
    requiredSkills: [configuration-control-conversation]
    requiredProviderProfiles: [configuration-proposal-only]
    knowledgeProfiles: []
    policyRef: docs/project-roles/configuration-steward.md
    permissions:
      write: none
      tools:
        - configuration_control_snapshot
        - configuration_proposal_list
        - configuration_proposal_get
        - configuration_proposal_create
  gate-steward:
    displayName: 工作流门禁管家
    description: 通过受限 Gate Control MCP 查询门禁并生成待人工审批的变更提案。
    requiredSkills: [gate-control-conversation]
    requiredProviderProfiles: [gate-proposal-only]
    knowledgeProfiles: []
    policyRef: docs/project-roles/gate-steward.md
    permissions:
      write: none
      tools:
        - workflow_control_snapshot
        - workflow_change_list
        - workflow_change_get
        - workflow_change_propose
